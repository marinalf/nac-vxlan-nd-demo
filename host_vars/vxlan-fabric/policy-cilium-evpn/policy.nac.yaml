    groups:
      - name: leaf1_group
        priority: 500
        policies:
          - name: leaf1_bgp_freeform
      - name: leaf2_group
        priority: 500
        policies:
          - name: leaf2_bgp_freeform
      - name: leaf3_group
        priority: 500
        policies:
          - name: leaf3_bgp_freeform
      - name: leaf4_group
        priority: 500
        policies:
          - name: leaf4_bgp_freeform

    switches:
      - name: leaf1
        groups: [leaf1_group]
      - name: leaf2
        groups: [leaf2_group]
      - name: leaf3
        groups: [leaf3_group]
      - name: leaf4
        groups: [leaf4_group]
