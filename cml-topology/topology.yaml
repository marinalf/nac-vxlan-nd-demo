- id: n8
  label: Kind-Node
  node_definition: ubuntu
  x: -265
  y: 331
  ram: 8192
  cpus: 4
  boot_disk_size: 20
  image_definition: ubuntu-24-04-20250503
  interfaces:
  - id: n8-ens2
    label: ens2
    type: physical
    slot: 0
  - id: n8-ens3
    label: ens3
    type: physical
    slot: 1
  - id: n8-ens4
    label: ens4
    type: physical
    slot: 2
  - id: n8-ens5
    label: ens5
    type: physical
    slot: 3
  - id: n8-ens6
    label: ens6
    type: physical
    slot: 4
  configuration:
  - name: user-data
    content: |-
      #cloud-config
      hostname: kind-node
      ssh_pwauth: true

      users:
        - name: kindops
          gecos: Kind Ops User
          groups: sudo
          sudo: ALL=(ALL) NOPASSWD:ALL
          shell: /bin/bash
          lock_passwd: false
          ssh_authorized_keys:
            - ssh-ed25519 AAAA... your-key-here

      chpasswd:
        users:
          - name: kindops
            password: '<your-host-password-here>'
            type: text
        expire: false

      write_files:
        - path: /etc/netplan/60-static.yaml
          permissions: '0600'
          content: |
            network:
              version: 2
              ethernets:
                ens2:
                  dhcp4: false
                  addresses: [198.18.133.5/18]
                  routes:
                    - to: default
                      via: 198.18.128.1
                  nameservers:
                    addresses: [8.8.8.8]
        - path: /etc/netplan/61-fabric-interfaces.yaml
          permissions: '0644'
          content: |
            network:
              version: 2
              ethernets:
                ens3:
                  dhcp4: false
                  optional: true
                ens4:
                  dhcp4: false
                  optional: true
                ens5:
                  dhcp4: false
                  optional: true
                ens6:
                  dhcp4: false
                  optional: true

      runcmd:
        - rm -f /etc/netplan/50-cloud-init.yaml
        - netplan apply
        - sleep 10
        - |
          for i in 1 2 3 4 5; do
            curl -fsSL https://get.docker.com -o /tmp/get-docker.sh && break
            sleep 10
          done
        - sh /tmp/get-docker.sh
        - usermod -aG docker kindops
        - systemctl enable --now docker
        - curl -Lo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
        - chmod +x /usr/local/bin/kind
        - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
        - curl -fsSL -o /tmp/get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        - chmod +x /tmp/get_helm.sh
        - /tmp/get_helm.sh
        - curl -fsSL --remote-name-all https://github.com/cilium/cilium-cli/releases/latest/download/cilium-linux-amd64.tar.gz
        - tar xzvfC cilium-linux-amd64.tar.gz /usr/local/bin
        - rm -f cilium-linux-amd64.tar.gz
- id: n9
  label: red-endpoint
  node_definition: ubuntu
  x: -622
  y: 339
  image_definition: custom-ubuntu
  interfaces:
  - id: n9-ens2
    label: ens2
    type: physical
    slot: 0
  configuration:
  - name: user-data
    content: |-
      ## template: jinja
      #cloud-config

      {% set hostname = 'Host-Red' %}
      {% set addresses = '10.0.100.10/24' %}
      {% set gateway4 = '10.0.100.1' %}

      hostname: {{ hostname }}
      manage_etc_hosts: True
      system_info:
        default_user:
          name: cisco
      password: <your-host-password-here>
      chpasswd: { expire: False }
      ssh_pwauth: True
      ssh_authorized_keys:
        - your-ssh-pubkey-line-goes-here

      write_files:
        - path: /etc/netplan/50-cloud-init.yaml
          permissions: '0644'
          content: |
            network:
              version: 2
              ethernets:
                ens2:
                  dhcp4: false
                  addresses: [{{ addresses }}]
                  gateway4: {{ gateway4 }}

        - path: /home/cisco/startup.sh
          permissions: '755'
          content: |
            #!/bin/sh
            sudo ethtool -s ens2 speed 1000 duplex full
            sudo netplan generate
            sudo netplan apply
            sudo rm -rf /etc/hosts
            sudo touch /etc/hosts
            echo "127.0.0.1 {{ hostname }}" | sudo tee -a /etc/hosts
            echo "{{ addresses }} {{ hostname }}" | sudo tee -a /etc/hosts
            sudo lldpcli configure system hostname {{ hostname }}
            sudo lldpcli update
            stty cols 187 rows 21

      runcmd:
        - sudo /home/cisco/startup.sh
        - [
            su,
            cisco,
            -c,
            cat <(crontab -l 2>/dev/null) <(echo -e "@reboot /home/cisco/startup.sh") | crontab -,
          ]
