---
# ip proxy-arp on Vlan100/Vlan200 is required for Cilium's BGP-unnumbered peer to see ARP replies for the host subnet. 
- name: Add ip proxy-arp freeform policy to all leaves
  hosts: vxlan-fabric
  gather_facts: no
  vars:
    proxy_arp_conf: "interface Vlan100\n  ip proxy-arp\ninterface Vlan200\n  ip proxy-arp"
    leaf_serials:
      - 9LEAF000001   # leaf1
      - 9LEAF000002   # leaf2
      - 9LEAF000003   # leaf3
      - 9LEAF000004   # leaf4

  tasks:
    - name: Create the freeform policy on each leaf
      cisco.dcnm.dcnm_rest:
        method: POST
        path: "/appcenter/cisco/ndfc/api/v1/lan-fabric/rest/control/policies"
        json_data: >-
          {{ {
            'serialNumber': item,
            'entityType': 'SWITCH',
            'entityName': 'SWITCH',
            'templateName': 'switch_freeform',
            'description': 'proxy_arp_vlan100_vlan200',
            'priority': 500,
            'nvPairs': {'CONF': proxy_arp_conf}
          } | to_json }}
      loop: "{{ leaf_serials }}"

    - name: Deploy the policy to the switches
      cisco.dcnm.dcnm_rest:
        method: POST
        path: "/appcenter/cisco/ndfc/api/v1/lan-fabric/rest/control/fabrics/vxlan-fabric/config-deploy/{{ leaf_serials | join(',') }}"
